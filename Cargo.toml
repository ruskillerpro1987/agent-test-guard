[workspace]
members = [
    "crates/core",
    "crates/ast",
    "crates/rules",
    "crates/cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ruskillerpro1987"]
license = "MIT"
repository = "https://github.com/ruskillerpro1987/agent-test-guard"
homepage = "https://github.com/ruskillerpro1987/agent-test-guard"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_json_canonicalizer = "0.2"
blake3 = { version = "1.5", features = ["serde"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
thiserror = "2.0"
clap = { version = "4.5", features = ["derive", "env"] }
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
rayon = "1.10"
ignore = "0.4"
git2 = { version = "0.19", default-features = false, features = ["https"] }
cc = "1.0"
